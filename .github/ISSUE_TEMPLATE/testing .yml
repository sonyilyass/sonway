name: 📁 Form Profil Maba 2026
description: Form pengisian biodata maba untuk Directory Book Angkatan 2026.
title: "[PROFIL] NIM - Nama Lengkap"
labels: ["maba-2026"]
body:
  - type: input
    id: nim
    attributes:
      label: NIM (Nomor Induk Mahasiswa)
      placeholder: "Contoh: 240101001"
    validations:
      required: true

  - type: input
    id: nama
    attributes:
      label: Nama Lengkap & Panggilan
      placeholder: "Contoh: Budi Santoso (Budi)"
    validations:
      required: true

  - type: input
    id: asal
    attributes:
      label: Asal Daerah & Sekolah
      placeholder: "Contoh: Bandung / SMAN 3 Bandung"
    validations:
      required: true

  - type: textarea
    id: alasan
    attributes:
      label: Alasan Memilih Teknik Informatika
      placeholder: "Tuliskan alasan singkatmu di sini..."
    validations:
      required: true
